<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>灵境 · 新标签页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wallpaper-stage hidden" id="wallpaperStage" aria-hidden="true">
    <img class="wallpaper-media" id="staticWallpaperImg" alt="" decoding="async">
    <video class="wallpaper-media" id="dynamicWallpaperVideo" muted loop playsinline preload="auto" disablepictureinpicture></video>
    <img class="wallpaper-media" id="dynamicWallpaperGif" alt="" decoding="async">
  </div>

  <button class="settings-btn" id="settingsBtn" title="主题与壁纸">
    <svg viewBox="0 0 22 22" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="11" cy="11" r="3"/>
      <path d="M11 2.5v2M11 17.5v2M2.5 11h2M17.5 11h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 17.3l1.4-1.4M13.9 6.1l1.4-1.4"/>
    </svg>
  </button>

  <div class="theme-panel" id="themePanel">
    <div class="panel-header">主题与壁纸</div>
    <div class="color-grid" id="colorGrid"></div>
    <div class="wallpaper-section">
      <div class="wallpaper-title">自定义壁纸</div>
      <div class="wallpaper-row">
        <label class="wallpaper-upload">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>上传图片</span>
          <input type="file" id="staticWallpaperInput" accept="image/png,image/jpeg,image/webp,image/avif" hidden>
        </label>
        <label class="wallpaper-upload">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="14" height="14" rx="3"/>
            <path d="M16 10l6-3v10l-6-3"/>
          </svg>
          <span>上传动态</span>
          <input type="file" id="dynamicWallpaperInput" accept="video/*,image/gif" hidden>
        </label>
      </div>
      <div class="wallpaper-meta" id="wallpaperMeta">支持 JPG / PNG / WebP 静态图与 MP4 / WebM / GIF 动态壁纸</div>
      <button class="wallpaper-clear" id="wallpaperClear" disabled>移除自定义壁纸</button>
    </div>
  </div>

  <div class="container">
    <div class="info-area">
      <div class="browser-name" id="browserName"></div>
      <div class="greeting-clock" id="clockDisplay">--:--</div>
      <div class="greeting-text" id="greetingMsg">日暮温柔，风也醉人</div>
    </div>

    <div class="search-wrapper">
      <div class="search-box" id="searchBox">
        <button class="engine-btn" id="engineBtn" title="切换搜索引擎">
          <span class="engine-icon" id="engineIcon"></span>
          <svg class="chevron" viewBox="0 0 12 12" width="12" height="12">
            <path d="M3 5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="divider"></span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜你所想 · 即刻启程" autocomplete="off">
        <button class="history-btn" id="historyBtn" title="搜索历史">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
        <button class="search-submit" id="searchSubmit" aria-label="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
      <div class="engine-dropdown" id="engineDropdown"></div>
      <div class="history-panel" id="historyPanel">
        <div class="suggest-area" id="suggestArea"></div>
        <div class="history-header">
          <span>搜索历史</span>
          <button class="history-clear" id="historyClear">清除全部</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
